<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Connexion — Espace Admin — Les Bulles de Joie</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/custom.css" />
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center px-margin-mobile antialiased relative overflow-hidden">

<div class="decorative-bubble bg-primary w-96 h-96 -top-20 -left-20"></div>
<div class="decorative-bubble bg-secondary w-64 h-64 bottom-0 -right-10 opacity-[0.08]"></div>

<div class="relative z-10 w-full max-w-md">
<div class="flex flex-col items-center gap-3 mb-8">
<img alt="Logo Les Bulles de Joie" class="h-16 w-auto" src="../assets/images/logoo.png" />
<h1 class="font-headline-md text-headline-md text-primary text-center">Espace Admin</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Gestion du blog et des témoignages</p>
</div>

<form id="login-form" class="bg-surface-container-low rounded-3xl p-8 bubble-shadow space-y-5">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email</label>
<input class="form-field font-body-md text-body-md text-on-surface" id="email" name="email" placeholder="admin@lesbullesdejoie.fr" required type="email" autocomplete="username" />
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">Mot de passe</label>
<div class="relative">
<input class="form-field font-body-md text-body-md text-on-surface pr-14" id="password" name="password" placeholder="••••••••" required type="password" autocomplete="current-password" />
<button aria-label="Afficher le mot de passe" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" data-password-toggle type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div id="login-error" class="hidden items-center gap-2 px-4 py-3 rounded-xl bg-error-container text-on-error-container font-body-md text-[14px]">
<span class="material-symbols-outlined text-[20px]">error</span>
<span id="login-error-text">Identifiants incorrects.</span>
</div>
<button class="btn-lift w-full bg-primary text-on-primary font-label-md text-label-md px-8 py-4 rounded-full hover:bg-primary/90 transition-colors shadow-md flex items-center justify-center gap-2" type="submit" id="login-submit">
<span>Se connecter</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>

<div id="setup-notice" class="hidden mt-6 bg-tertiary-container/20 border border-tertiary-container/40 rounded-2xl p-5 flex items-start gap-3">
<span class="material-symbols-outlined text-tertiary mt-0.5">info</span>
<p class="font-body-md text-[14px] text-on-surface-variant">Supabase n'est pas encore configuré (fichier <code>js/supabase-config.js</code>). Consultez le <code>README.md</code> pour créer le projet et générer un compte admin.</p>
</div>

<div class="text-center mt-6">
<a class="font-body-md text-[14px] text-on-surface-variant hover:text-primary transition-colors" href="../index.html">← Retour au site</a>
</div>
</div>

<script type="module" src="login.js"></script>
</body>
</html>
